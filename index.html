<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haqin</title>
  <meta name="description" content="Haqin: designs, projects, article entries.">
  <meta name="theme-color" content="#3F5C3E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Haqin">

  <!-- Seedling favicon -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233F5C3E' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 21v-9'/%3E%3Cpath d='M12 13C7.5 13 5 10.5 5 6.5c4.5 0 7 2.5 7 6.5z' fill='%23A3BC91'/%3E%3Cpath d='M12 11c0-4 2.5-6.5 7-6.5 0 4-2.5 6.5-7 6.5z' fill='%23A3BC91'/%3E%3Cpath d='M8 21h8'/%3E%3C/svg%3E">

  <!-- Remember day / night mode before the page paints (stops a flash) -->
  <script>
    try { if (localStorage.getItem("hardin-theme") === "night") document.documentElement.dataset.theme = "night"; } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a class="skip-link" href="#view">Skip to content</a>

  <!-- Thin green line that sweeps across the top when you change page -->
  <div id="route-bar" class="route-bar" aria-hidden="true"></div>
  <!-- Reading progress (only used on post pages) -->
  <div id="read-progress" class="read-progress" aria-hidden="true"></div>

  <!-- ===== Top bar (on every page) ===== -->
  <nav class="topbar" aria-label="Main">
    <a class="brand" href="#/" aria-label="Haqin home">
      <span class="brand-icon" id="brand-icon"></span>
      <span class="brand-name">Haqin</span>
    </a>

    <label class="searchbox topsearch">
      <span id="search-icon"></span>
      <input id="search" type="search" placeholder="Search posts" aria-label="Search posts" title="Press / to search" autocomplete="off">
    </label>

    <div class="topnav">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/about" data-nav="about">About</a>
      <a href="#/saved" data-nav="saved">Saved <span id="saved-count" class="count-badge" hidden>0</span></a>
      <details class="feature-menu">
        <summary class="menu-toggle" aria-label="Open features menu">☰</summary>
        <div class="menu-panel">
          <strong>My features</strong>
          <a href="#/tasks" data-nav="tasks">Tasks & reminders</a>
          <a href="#/wallet" data-nav="wallet">Savings wallet</a>
          <a href="#/prayer" data-nav="prayer">Prayer wall</a>
          <a href="#/devotionals" data-nav="devotionals">Devotionals</a>
        </div>
      </details>
      <button id="install-app" class="btn ghost small install-app" type="button" hidden>Install app</button>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch to night mode"></button>
    </div>
  </nav>

  <!-- Optional message you set in Admin > Settings -->
  <div id="announcement" class="announcement" role="status" hidden>
    <span id="announcement-text"></span>
    <a id="announcement-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Read more</a>
    <button id="announcement-close" class="icon-btn small" type="button" aria-label="Dismiss this message"></button>
  </div>

  <!-- ===== The current page is drawn in here ===== -->
  <main id="view" class="view" tabindex="-1">
    <p class="status">Loading Haqin…</p>
  </main>

  <!-- ===== Footer (on every page) ===== -->
  <footer class="site-footer">
    <p id="visit-count" class="visit-count"></p>
    <p>Ann &copy; 2026 Haqin. Little Corner .</p>
  </footer>

  <!-- =====================================================
       Page templates. app.js copies one of these into <main>
       whenever you move to a new page.
       ===================================================== -->

  <!-- ---------- Home ---------- -->
  <template id="tpl-home">
    <header class="hero">
      <div class="hero-text">
        <h1>Haqin</h1>
        <p class="tagline" data-slot="tagline">Designs, projects, and article entries.</p>
        <p class="hero-note">Haqin hardin</p>
        <div class="hero-actions">
          <button class="btn primary small" type="button" data-slot="surprise" hidden></button>
        </div>
      </div>

      <!-- A small garden that draws itself once when the page opens -->
      <svg class="botanical" viewBox="0 0 320 280" aria-hidden="true">
        <circle class="sun" cx="262" cy="48" r="26" />
        <g transform="translate(50 10)">
          <path pathLength="1" d="M100 252 C98 200 104 140 98 34" />
          <path class="leaf" pathLength="1" d="M99 205 C62 202 40 178 38 150 C72 150 96 172 99 205 Z" />
          <path class="leaf" pathLength="1" d="M100 175 C138 172 160 148 162 120 C128 120 103 142 100 175 Z" />
          <path class="leaf" pathLength="1" d="M99 135 C68 130 50 108 50 82 C80 84 98 106 99 135 Z" />
          <path class="leaf" pathLength="1" d="M99 98 C126 94 144 76 146 52 C118 54 101 72 99 98 Z" />
          <path class="leaf" pathLength="1" d="M98 34 C84 24 86 10 98 4 C112 12 112 26 98 34 Z" />
        </g>
        <g transform="translate(10 91) scale(.68)">
          <path pathLength="1" d="M100 252 C98 200 104 140 98 34" />
          <path class="leaf" pathLength="1" d="M99 205 C62 202 40 178 38 150 C72 150 96 172 99 205 Z" />
          <path class="leaf" pathLength="1" d="M100 175 C138 172 160 148 162 120 C128 120 103 142 100 175 Z" />
          <path class="leaf" pathLength="1" d="M99 135 C68 130 50 108 50 82 C80 84 98 106 99 135 Z" />
          <path class="leaf" pathLength="1" d="M98 34 C84 24 86 10 98 4 C112 12 112 26 98 34 Z" />
        </g>
        <g transform="translate(178 60) scale(.8)">
          <path pathLength="1" d="M100 252 C98 200 104 140 98 34" />
          <path class="leaf" pathLength="1" d="M99 205 C62 202 40 178 38 150 C72 150 96 172 99 205 Z" />
          <path class="leaf" pathLength="1" d="M100 175 C138 172 160 148 162 120 C128 120 103 142 100 175 Z" />
          <path class="leaf" pathLength="1" d="M99 98 C126 94 144 76 146 52 C118 54 101 72 99 98 Z" />
          <path class="leaf" pathLength="1" d="M98 34 C84 24 86 10 98 4 C112 12 112 26 98 34 Z" />
        </g>
        <path class="ground" pathLength="1" d="M14 264 H306" />
      </svg>
    </header>

    <div class="home-layout">
      <div class="home-main">

        <div class="view-bar" data-slot="folder-controls"></div>

        <section class="block" data-slot="folders-block">
          <h2 class="section-title">Explore folders</h2>
          <div class="folders" data-slot="tiles"></div>
        </section>

        <section class="block" data-slot="featured-block">
          <h2 class="section-title">Featured</h2>
          <div class="grid" data-slot="featured"></div>
        </section>

        <section class="block">
          <h2 class="section-title" data-slot="latest-title">Latest</h2>
          <div class="grid" data-slot="grid"></div>
          <p class="status" data-slot="empty" hidden></p>
        </section>

      </div>

      <aside class="home-side">
        <div data-slot="calendar"></div>
      </aside>
    </div>
  </template>

  <!-- ---------- Folder, tag, day and search pages ---------- -->
  <template id="tpl-list">
    <nav class="breadcrumbs" data-slot="crumbs" aria-label="Breadcrumb"></nav>

    <header class="page-head">
      <h1 data-slot="title"></h1>
      <p class="page-sub" data-slot="sub"></p>
    </header>

    <div class="list-layout" data-slot="layout">
      <div class="list-main">
        <div class="events" data-slot="events" hidden></div>
        <div class="view-bar" data-slot="folder-controls" hidden></div>
        <div class="folders" data-slot="tiles" hidden></div>
        <div class="grid" data-slot="grid"></div>
        <p class="status" data-slot="empty" hidden></p>
      </div>
      <aside class="home-side" data-slot="side" hidden></aside>
    </div>
  </template>

  <!-- ---------- One post (the reading page) ---------- -->
  <template id="tpl-post">
    <article class="post-page">
      <nav class="breadcrumbs" data-slot="crumbs" aria-label="Breadcrumb"></nav>

      <header class="post-head">
        <span class="badge" data-slot="badge"></span>
        <h1 class="post-title" data-slot="title"></h1>
        <p class="post-dek" data-slot="dek" hidden></p>
        <div class="meta-row post-meta" data-slot="meta"></div>
        <div class="post-tools" data-slot="tools"></div>
      </header>

      <details class="toc" data-slot="toc" hidden>
        <summary>On this page</summary>
        <ol class="toc-list" data-slot="toc-list"></ol>
      </details>

      <div data-slot="embed"></div>
      <div class="prose" data-slot="body"></div>
      <div data-slot="link"></div>
      <div class="post-actions" data-slot="actions"></div>

      <section class="keep-reading" data-slot="more-block">
        <h2 class="section-title">Keep reading</h2>
        <ul class="more-list" data-slot="more"></ul>
      </section>
    </article>
  </template>

  <!-- ---------- About ---------- -->
  <template id="tpl-about">
    <nav class="breadcrumbs" data-slot="crumbs" aria-label="Breadcrumb"></nav>

    <section class="about">
      <div class="about-portrait" data-slot="portrait" aria-hidden="true"></div>
      <div class="about-body">
        <h1>About me</h1>
        <div class="about-text" data-slot="about-text">
          <p>Hi, I'm Ann. Haqin is my little corner of the internet, where I keep my designs, projects and article entries.</p>
          <p>Thanks for stopping by. Take a look around, and say hello if you like.</p>
        </div>

        <ul class="contact-list">
          <li>
            <a class="contact" href="https://www.facebook.com/profile.php" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
              <span>Facebook</span>
            </a>
          </li>
          <li>
            <a class="contact" href="https://t.me" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
              <span>Telegram</span>
            </a>
          </li>
          <li>
            <a class="contact" href="mailto:tekstichoi@gmail.com" target="_blank" rel="noopener noreferrer" aria-label="Email">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>
              <span>Email</span>
            </a>
          </li>
          <li>
            <a class="contact" href="https://github.com/sabsja" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4.2c.1-1.1-.4-2.2-1.4-2.8 4.6-.5 6.4-2.3 6.4-6.2a4.8 4.8 0 0 0-1.3-3.4A4.5 4.5 0 0 0 18.6 2S17.4 1.6 15 3.2a11.5 11.5 0 0 0-6 0C6.6 1.6 5.4 2 5.4 2a4.5 4.5 0 0 0-.1 3.4A4.8 4.8 0 0 0 4 8.8c0 3.9 1.8 5.7 6.4 6.2-1 .6-1.5 1.7-1.4 2.8V22"/><path d="M9 18c-4.5 2-5-2-7-2"/></svg>
              <span>GitHub</span>
            </a>
          </li>
        </ul>
      </div>
    </section>
  </template>

  <!-- ---------- Private features ---------- -->
  <template id="tpl-tasks">
    <nav class="breadcrumbs"><a class="crumb" href="#/">Home</a><span class="crumb-sep">›</span><span class="crumb">Tasks</span></nav>
    <header class="page-head"><h1>Tasks & reminders</h1><p class="page-sub">A small list for today and the things you do not want to forget.</p></header>
    <section class="feature-layout">
      <div class="panel">
        <form data-feature-form="task" class="feature-form">
          <label class="field"><span>Task</span><input data-task-title type="text" maxlength="120" placeholder="What needs doing?" required></label>
          <label class="field"><span>Reminder date and time</span><input data-task-due type="datetime-local"></label>
          <div class="button-row"><button class="btn primary" type="submit">Add task</button><button class="btn ghost" data-notify type="button">Allow notifications</button></div>
        </form>
        <p class="hint" data-task-status></p>
      </div>
      <div class="panel"><div class="feature-panel-head"><h2>My list</h2><button class="btn ghost small" data-clear-done type="button">Clear done</button></div><ul class="feature-list" data-task-list></ul></div>
    </section>
  </template>

  <template id="tpl-wallet">
    <nav class="breadcrumbs"><a class="crumb" href="#/">Home</a><span class="crumb-sep">›</span><span class="crumb">Wallet</span></nav>
    <header class="page-head"><h1>Savings wallet</h1><p class="page-sub">Track allowance, savings, wants, and needs in one quiet place.</p></header>
    <section class="feature-layout">
      <div class="panel wallet-summary"><p class="eyebrow">Current balance</p><strong data-wallet-balance>$0.00</strong><div class="wallet-breakdown" data-wallet-breakdown></div></div>
      <div class="panel"><form data-feature-form="wallet" class="feature-form"><div class="field-row"><label class="field"><span>Type</span><select data-wallet-kind><option value="in">Money in</option><option value="out">Money out</option></select></label><label class="field"><span>Category</span><select data-wallet-category><option>Allowance</option><option>Savings</option><option>Wants</option><option>Needs</option></select></label></div><div class="field-row"><label class="field"><span>Amount</span><input data-wallet-amount type="number" min="0" step="0.01" placeholder="0.00" required></label><label class="field"><span>Note</span><input data-wallet-note type="text" maxlength="80" placeholder="Optional"></label></div><button class="btn primary" type="submit">Add entry</button></form></div>
      <div class="panel"><h2>Recent entries</h2><ul class="feature-list" data-wallet-list></ul></div>
    </section>
  </template>

  <template id="tpl-prayer">
    <nav class="breadcrumbs"><a class="crumb" href="#/">Home</a><span class="crumb-sep">›</span><span class="crumb">Prayer wall</span></nav>
    <header class="page-head"><h1>Prayer wall</h1><p class="page-sub">Keep a gentle, editable page for each month.</p></header>
    <section class="panel prayer-panel"><label class="field"><span>Month</span><input data-prayer-month type="month"></label><label class="field"><span>Prayer notes</span><textarea data-prayer-text rows="14" placeholder="Write your prayers, hopes, and gratitude here..."></textarea></label><div class="button-row"><button class="btn primary" data-save-prayer type="button">Save this month</button><span class="hint" data-prayer-status></span></div></section>
  </template>

  <template id="tpl-devotionals">
    <nav class="breadcrumbs"><a class="crumb" href="#/">Home</a><span class="crumb-sep">›</span><span class="crumb">Devotionals</span></nav>
    <header class="page-head"><h1>Devotionals</h1><p class="page-sub">A quiet place to write what you are learning from Scripture.</p></header>
    <section class="devotional-layout">
      <article class="panel devotional-today" data-devotional-today>
        <p class="eyebrow">Today’s devotional</p>
        <h2 data-today-title>Begin with a reading</h2>
        <p class="devotional-reference" data-today-reference></p>
        <p data-today-reading></p>
        <blockquote data-today-reflection hidden></blockquote>
        <p class="devotional-prayer" data-today-prayer></p>
      </article>
      <section class="panel">
        <div class="feature-panel-head"><h2 data-devotional-form-title>New devotional</h2><button class="btn ghost small" data-devotional-today-button type="button">Use today</button></div>
        <form data-feature-form="devotional" class="feature-form">
          <label class="field"><span>Date</span><input data-devotional-date type="date" required></label>
          <label class="field"><span>Title</span><input data-devotional-title type="text" maxlength="120" placeholder="What is God teaching me?" required></label>
          <label class="field"><span>Bible reading or reference</span><input data-devotional-reference type="text" maxlength="120" placeholder="John 15:1-8"></label>
          <label class="field"><span>Reading notes</span><textarea data-devotional-reading rows="5" placeholder="Write the verse, summary, or key words..."></textarea></label>
          <label class="field"><span>Reflection</span><textarea data-devotional-reflection rows="5" placeholder="What stood out to me today?"></textarea></label>
          <label class="field"><span>Prayer</span><textarea data-devotional-prayer rows="4" placeholder="My prayer..."></textarea></label>
          <div class="button-row"><button class="btn primary" type="submit">Save devotional</button><button class="btn ghost" data-devotional-cancel type="button" hidden>Cancel editing</button></div>
          <p class="hint" data-devotional-status></p>
        </form>
      </section>
      <section class="panel devotional-history"><div class="feature-panel-head"><h2>My readings</h2><span class="hint" data-devotional-count></span></div><ul class="feature-list" data-devotional-list></ul></section>
    </section>
  </template>

  <!-- ---------- Page not found ---------- -->
  <template id="tpl-missing">
    <section class="missing">
      <h1>That page isn't in the garden</h1>
      <p>It may have been moved, turned back into a draft, or the link is a little off.</p>
      <a class="btn primary" href="#/">Back to Haqin</a>
    </section>
  </template>

  <script type="module" src="app.js?v=devotionals1"></script>
</body>
</html>
